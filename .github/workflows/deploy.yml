name: Deploy MkDocs to GCS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Sync Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4 # Latest v4.x

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2 # Latest v2.x

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2 # Latest v2.x

      - name: Set up Python
        uses: actions/setup-python@v5 # Latest v5.x
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade mkdocs-material mkdocs-minify-plugin

      - name: Build MkDocs Site
        run: |
          mkdocs build

      - name: Sync Site Artifacts to GCS Bucket
        run: |
          gcloud storage rsync --recursive --delete-unmatched-destination-objects site/ gs://${{ secrets.GCS_BUCKET }}
