name: Deploy MkDocs to GCS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Sync Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4 # Latest v4.x
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2 # Latest v2.x
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}


      - name: Set up Python
        uses: actions/setup-python@v5 # Latest v5.x
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Documentation
        run: |
          npx -y markdownlint-cli2 "docs/**/*.md" || true

      - name: Build MkDocs Site (Strict Mode)
        run: |
          mkdocs build --strict

      - name: Sync Site Artifacts to GCS Bucket
        run: |
          gcloud storage rsync site/ gs://${{ secrets.GCS_BUCKET }} --recursive --delete-unmatched-destination-objects --gzip-in-flight-all
