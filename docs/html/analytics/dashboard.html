<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>分析ダッシュボード概要</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; background: #0f172a; color: #f8fafc; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .metric { background: #1e293b; padding: 1.5rem; border-radius: 8px; }
        h1 { color: #38bdf8; }
    </style>
</head>
<body>
    <h1>分析ダッシュボード概要</h1>
    <div class="grid">
        <div class="metric">
            <h3>月間アクティブユーザー</h3>
            <p style="font-size: 2rem; font-weight: bold; color: #4ade80;">12,450</p>
        </div>
        <div class="metric">
            <h3>平均応答速度</h3>
            <p style="font-size: 2rem; font-weight: bold; color: #38bdf8;">142 ms</p>
        </div>
    </div>
</body>
</html>
