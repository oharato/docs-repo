site_name: Internal Documentation Hub
site_description: Internal technical documentation powered by MkDocs Material, GCS, Cloud Run, and IAP.
site_author: Platform Engineering Team

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_css:
  - extra.css

extra_javascript:
  - extra.js

nav:
  - ホーム: index.md
  - アーキテクチャ概要: architecture.md
  - システム仕様・運用:
      - プロジェクト概要・セットアップ: system/getting_started.md
      - 詳細システム設計仕様: system/architecture_spec.md
      - コードレビュー結果: system/code_review.md
      - ハマりポイント・設定ノウハウ集: system/pitfalls_and_tips.md
      - HTMLドキュメント配信ガイド: system/html_delivery_guide.md
  - HTMLコンテンツ (Raw HTML): html/index.md
  - 技術ナレッジ (Knowledge):
      - 2026年08月:
          - Mermaid ダイアグラム自動検証・リンターガイド: knowledge/2026-08/2026-08-09_mermaid_linter_and_validation_guide.md
          - Better Auth + Cloudflare + Hono ガイド: knowledge/2026-08/2026-08-05_better_auth_cloudflare_hono_guide.md
          - Linux CLI エディタ比較 & Fresh ガイド: knowledge/2026-08/2026-08-05_linux_cli_editors_with_filetree.md
          - 社内ドキュメント共有手法・アーキテクチャ調査: knowledge/2026-08/2026-08-05_modern_internal_doc_sharing_methods.md
          - OpenJDK Project Valhalla 概要解説: knowledge/2026-08/2026-08-05_project_valhalla_overview.md
          - Spring Boot 高速化 & Java フレームワーク: knowledge/2026-08/2026-08-05_spring_boot_speedup_and_fast_java_frameworks.md
          - TOPIXリバランス空売り戦略の検証: knowledge/2026-08/2026-08-08_topix_rebalance_short_selling_strategy.md
